<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | La Paz te Acerca</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: var(--fuente-cuerpo, 'Inter', sans-serif); background: var(--gris-suave, #FDFBF7); }
        .error-container { text-align: center; padding: 2rem; max-width: 500px; }
        .error-code { font-size: 8rem; font-weight: 900; color: var(--azul-confianza, #1E40AF); margin: 0; font-family: var(--fuente-titulos, 'Poppins', sans-serif); line-height: 1; }
        .error-message { font-size: 1.5rem; color: var(--gris-oscuro, #334155); margin: 1rem 0 2rem; }
        .error-btn { display: inline-block; padding: 1rem 2rem; background: var(--gradiente-ocre, linear-gradient(135deg, #D97706, #B45309)); color: white; text-decoration: none; border-radius: 12px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">La página que buscas no existe o fue movida</p>
        <a href="index.html" class="error-btn"><i class="fas fa-home"></i> Volver al inicio</a>
    </div>
</body>
</html>
