name = "lapazteacerca"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# Configuración de Functions
[vars]
# Variables de entorno públicas (no sensibles)
SITE_NAME = "La Paz te Acerca"
SITE_URL = "https://lapazteacerca.com"

# Secrets (se configuran con: wrangler secret put NOMBRE)
# ADMIN_USER = (se configura con wrangler secret put ADMIN_USER)
# ADMIN_PASS = (se configura con wrangler secret put ADMIN_PASS)
# GITHUB_TOKEN = (se configura con wrangler secret put GITHUB_TOKEN)
# IMGBB_API_KEY = (se configura con wrangler secret put IMGBB_API_KEY)